<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrar Sonaste</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f3f3;
    font-family: Arial, sans-serif;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    margin: 0;
}

.contenedor {
    max-width: 600px;
    margin: 25px auto;
    padding: 15px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.1);
}

input,
textarea {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 17px;
}

textarea {
    min-height: 120px;
}

button {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 9px;
    background: #111;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

#foto {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
    display: none;
}

#mensaje {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.oculto {
    display: none;
}

.logout {
    background: #777;
    margin-top: 12px;
}

</style>

</head>

<body>

<header>

<h1>SONASTE</h1>

<p>Panel de administración</p>

</header>


<div class="contenedor">

<div class="panel">


<!-- LOGIN -->

<div id="login">

<h2>Ingresar</h2>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Tu email"
>


<label>Contraseña</label>

<input
type="password"
id="password"
placeholder="Tu contraseña"
>


<button onclick="ingresar()">

ENTRAR

</button>

</div>



<!-- ADMINISTRACIÓN -->

<div id="admin" class="oculto">

<h2>Publicar nueva Sonaste</h2>


<label>Frase</label>

<textarea
id="frase"
placeholder="Escribí la frase del día..."
></textarea>


<label>Novedad</label>

<textarea
id="novedad"
placeholder="Escribí una novedad..."
></textarea>


<label>Foto</label>

<input
type="file"
id="archivo"
accept="image/*"
>


<img id="foto">


<button
id="publicar"
onclick="publicar()"
>

PUBLICAR

</button>


<div id="mensaje"></div>


<button
class="logout"
onclick="salir()"
>

CERRAR SESIÓN

</button>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// COMPROBAR SESIÓN

async function comprobarSesion(){

    const {
        data: { session }
    } =
    await db.auth.getSession();


    if(session){

        document
        .getElementById("login")
        .classList.add("oculto");


        document
        .getElementById("admin")
        .classList.remove("oculto");


        cargarActual();
    }
}



// ENTRAR

async function ingresar(){

    const email =
    document.getElementById("email").value;


    const password =
    document.getElementById("password").value;


    const { error } =
    await db.auth.signInWithPassword({

        email: email,

        password: password

    });


    if(error){

        alert(
            "Email o contraseña incorrectos."
        );

        return;
    }


    document
    .getElementById("login")
    .classList.add("oculto");


    document
    .getElementById("admin")
    .classList.remove("oculto");


    cargarActual();
}



// CARGAR PUBLICACIÓN ACTUAL

async function cargarActual(){

    const { data, error } =

    await db
    .from("sonaste")
    .select("*")
    .eq("id",1)
    .single();


    if(error){

        console.error(error);

        return;
    }


    document
    .getElementById("frase")
    .value =
    data.frase || "";


    document
    .getElementById("novedad")
    .value =
    data.novedad || "";


    if(data.foto_url){

        const imagen =
        document.getElementById("foto");


        imagen.src =
        data.foto_url;


        imagen.style.display =
        "block";
    }
}



// PREVISUALIZAR FOTO

document
.getElementById("archivo")
.addEventListener(
    "change",
    function(){

        const archivo =
        this.files[0];


        if(!archivo){

            return;
        }


        const imagen =
        document.getElementById("foto");


        imagen.src =
        URL.createObjectURL(
            archivo
        );


        imagen.style.display =
        "block";
    }
);



// PUBLICAR

async function publicar(){

    const boton =
    document.getElementById("publicar");


    const mensaje =
    document.getElementById("mensaje");


    const frase =
    document
    .getElementById("frase")
    .value
    .trim();


    const novedad =
    document
    .getElementById("novedad")
    .value
    .trim();


    const archivo =
    document
    .getElementById("archivo")
    .files[0];


    if(!frase){

        alert(
            "Escribí una frase."
        );

        return;
    }


    boton.disabled =
    true;


    mensaje.innerText =
    "Publicando...";


    let fotoUrl =
    null;



    // SUBIR FOTO

    if(archivo){

        const extension =
        archivo.name
        .split(".")
        .pop()
        .toLowerCase();


        const nombre =
        "sonaste-" +
        Date.now() +
        "." +
        extension;


        const { error } =

        await db.storage
        .from("sonaste-fotos")
        .upload(
            nombre,
            archivo,
            {
                cacheControl:"3600",
                upsert:false
            }
        );


        if(error){

            console.error(error);


            mensaje.innerText =
            "Error al subir la foto.";


            boton.disabled =
            false;


            return;
        }


        fotoUrl =

        db.storage
        .from("sonaste-fotos")
        .getPublicUrl(
            nombre
        )
        .data
        .publicUrl;
    }



    // ACTUALIZAR SONASTE

    const cambios = {

        frase: frase,

        novedad: novedad,

        fecha:
        new Date().toISOString()

    };


    if(fotoUrl){

        cambios.foto_url =
        fotoUrl;
    }


    const { error } =

    await db
    .from("sonaste")
    .update(cambios)
    .eq("id",1);


    if(error){

        console.error(error);


        mensaje.innerText =
        "Error al publicar.";

    } else {

        mensaje.innerText =
        "¡PUBLICADO CORRECTAMENTE!";


        document
        .getElementById("archivo")
        .value = "";
    }


    boton.disabled =
    false;
}



// CERRAR SESIÓN

async function salir(){

    await db.auth.signOut();

    location.reload();
}


comprobarSesion();

</script>

</body>

</html>
